[project]
name = "vc-isomer"
version = "0.1.2"
description = "W3C isomer services and tooling for vLEI VRD credentials"
readme = "README.md"
requires-python = ">=3.12.6,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kent Bull", email = "kent@kentbull.com" }
]
keywords = ["keri", "vlei", "acdc", "w3c", "vc-jwt", "did:webs"]
dependencies = [
    "falcon>=4.0.2",
    "gleif_hio==0.6.22",
    "gleif_keri==1.2.19",
    "PyLD>=2.0.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]
test = [
    "jsonschema>=4.0,<5",
    "mockito>=1.5,<2",
    "pytest>=9.0.3,<10",
]
live = [
    "signifypy>=0.4.2,<0.5.0",
    "vlei==1.0.7",
    "did-webs-resolver==0.3.8",
]

[project.scripts]
isomer = "vc_isomer.cli:main"

[build-system]
requires = ["hatchling>=1.31,<1.32"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "test", "live"]

[tool.hatch.build.targets.wheel]
packages = ["src/vc_isomer"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/headless-w3c-e2e/src", "packages/signifypy-w3c/src", "packages/signifypy-did-webs/src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.uv.sources.signifypy]
git = "https://github.com/kentbull/signifypy.git"
rev = "34ba0dd25ee8fca21404e1237d8f441addfc68e6"

[tool.uv.sources.did-webs-resolver]
git = "https://github.com/kentbull/did-webs-resolver.git"
rev = "733242767e05db656b0a39f934d6b81dfd01ef5b"
