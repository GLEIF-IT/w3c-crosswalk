[project]
name = "vc-isomer"
version = "0.1.0"
description = "W3C isomer services and tooling for vLEI VRD credentials"
readme = "README.md"
requires-python = ">=3.12.6,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kent Bull", email = "kent@kentbull.com" }
]
keywords = ["keri", "vlei", "acdc", "w3c", "vc-jwt", "did:webs"]
dependencies = [
    "falcon>=4.0.2",
    "gleif_hio==0.6.21",
    "gleif_keri==1.2.16",
    "PyLD>=2.0.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]
test = [
    "jsonschema>=4.0,<5",
    "mockito>=1.5,<2",
    "pytest>=8.4,<9",
]
live = [
    "signifypy>=0.4.2,<0.5.0",
    "vlei>=1.0.2,<2",
    "did-webs-resolver==0.3.7",
]

[project.scripts]
isomer = "vc_isomer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "test", "live"]

[tool.uv.sources]
vlei = { git = "https://github.com/kentbull/vLEI.git", rev = "8d295223759a4bfe63b3d615b6c785f5b9b2950e" }

[tool.hatch.build.targets.wheel]
packages = ["src/vc_isomer"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/headless-w3c-e2e/src", "packages/signifypy-w3c/src", "packages/signifypy-did-webs/src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.uv.sources.signifypy]
git = "https://github.com/kentbull/signifypy.git"
rev = "4ba4c2231302a914f44fd1b03e4610a0a93d84c6"

[tool.uv.sources.did-webs-resolver]
git = "https://github.com/kentbull/did-webs-resolver.git"
rev = "471d78b963b0205806ef22a165ac9578532b0e6d"
